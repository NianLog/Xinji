<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="xinjiHeroTitle xinjiHeroDesc">
  <title id="xinjiHeroTitle">心记 Xinji：给硅基生命一颗会记的心</title>
  <desc id="xinjiHeroDesc">左侧是心记标志与品牌语，右侧演示一次对话的记忆回路：原话进入 L0，整理成记忆与关系，再判断该不该提，最后选择自然提起或保持沉默。</desc>
  <defs>
    <linearGradient id="heroPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf4"/>
      <stop offset="1" stop-color="#f6efe3"/>
    </linearGradient>
    <radialGradient id="heroGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2efeb" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e2efeb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8e3da" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f8e3da" stop-opacity="0"/>
    </radialGradient>
    <pattern id="heroDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c9bda9"/>
    </pattern>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1f2d2b" flood-opacity="0.08"/>
    </filter>
    <marker id="heroArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#356d6a"/>
    </marker>
    <clipPath id="heroClip">
      <rect x="0" y="0" width="1200" height="470" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1200" height="470" fill="url(#heroPaper)"/>
    <rect x="620" width="580" height="470" fill="url(#heroDots)" opacity="0.5"/>
    <ellipse cx="1090" cy="50" rx="280" ry="200" fill="url(#heroGlowA)"/>
    <ellipse cx="150" cy="470" rx="320" ry="170" fill="url(#heroGlowB)"/>
    <path d="M620 40 V430" stroke="#e3d9c8" stroke-width="1" stroke-dasharray="2 8"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="468.5" rx="27.25" fill="none" stroke="#e3d9c8" stroke-width="1.5"/>

  <g transform="translate(64 64) scale(0.5)">
    <rect x="4" y="4" width="152" height="152" rx="38" fill="#1f2d2b"/>
    <rect x="10" y="10" width="140" height="140" rx="32" fill="none" stroke="#f7efe1" stroke-opacity="0.14" stroke-width="1.5"/>
    <path d="M80 127 C52 107 31 86 31 62 C31 45 44 32 60 32 C69 32 76 37 80 44 C84 37 91 32 100 32 C116 32 129 45 129 62 C129 86 108 107 80 127 Z" fill="#f7efe1"/>
    <g fill="none" stroke="#244b46" stroke-width="3.4" stroke-linecap="round">
      <path d="M58 64 H102"/>
      <path d="M58 76 H102"/>
      <path d="M58 88 H92"/>
    </g>
    <circle cx="80" cy="103" r="4.5" fill="#cf6b4f"/>
    <circle cx="132" cy="132" r="5" fill="#cf6b4f"/>
  </g>

  <text x="168" y="126" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','STSong',serif" font-size="62" font-weight="700" fill="#1f2d2b" letter-spacing="2">心记</text>
  <text x="172" y="158" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#a48b62" letter-spacing="7">XINJI</text>

  <text x="64" y="240" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#1f2d2b">给硅基生命一颗会记的心。</text>
  <text x="64" y="282" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17.5" fill="#6f7d77">一套记得住、说得对、也忘得掉的长期关系记忆系统。</text>

  <g font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="64" y="318" width="112" height="36" rx="18" fill="#fffdf8" stroke="#ded4c3"/>
    <circle cx="82" cy="336" r="3.5" fill="#2e6b64"/>
    <text x="123" y="341" font-size="14" font-weight="600" fill="#3f514d" text-anchor="middle">记得住</text>

    <rect x="190" y="318" width="112" height="36" rx="18" fill="#fffdf8" stroke="#ded4c3"/>
    <circle cx="208" cy="336" r="3.5" fill="#cf6b4f"/>
    <text x="249" y="341" font-size="14" font-weight="600" fill="#3f514d" text-anchor="middle">说得对</text>

    <rect x="316" y="318" width="112" height="36" rx="18" fill="#fffdf8" stroke="#ded4c3"/>
    <circle cx="334" cy="336" r="3.5" fill="#b99a62"/>
    <text x="375" y="341" font-size="14" font-weight="600" fill="#3f514d" text-anchor="middle">忘得掉</text>
  </g>

  <g font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <path d="M64 404 H100" stroke="#b99a62" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="409" font-size="13" font-weight="600" fill="#a48b62" letter-spacing="2">芯生命，用心记。</text>
  </g>

  <g filter="url(#heroShadow)">
    <rect x="700" y="52" width="436" height="366" rx="26" fill="#fffdf8" stroke="#e6ddcc"/>
  </g>

  <g font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <circle cx="733" cy="84" r="4" fill="#2e6b64"/>
    <text x="746" y="89" font-size="12.5" font-weight="600" fill="#7b8a84" letter-spacing="1.5">一次对话的记忆回路</text>

    <rect x="728" y="106" width="250" height="62" rx="18" fill="#fffdf8" stroke="#e5dccb"/>
    <rect x="744" y="122" width="3" height="28" rx="1.5" fill="#cf6b4f"/>
    <text x="758" y="144" font-size="17.5" fill="#2a3835">你上次说，喜欢海。</text>

    <path d="M803 170 V196" fill="none" stroke="#356d6a" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#heroArrow)"/>

    <g>
      <rect x="728" y="200" width="250" height="40" rx="12" fill="#fbede7" stroke="#f0d6ca"/>
      <rect x="740" y="212" width="4" height="16" rx="2" fill="#cf6b4f"/>
      <text x="754" y="217" font-size="13.5" font-weight="700" fill="#9a4f39">原话 · L0</text>
      <text x="754" y="232" font-size="11.5" fill="#8a7d72">只追加，不改写</text>
    </g>
    <g>
      <rect x="728" y="246" width="250" height="40" rx="12" fill="#eaf2ef" stroke="#d5e5df"/>
      <rect x="740" y="258" width="4" height="16" rx="2" fill="#2e6b64"/>
      <text x="754" y="263" font-size="13.5" font-weight="700" fill="#2e6b64">整理 · L1</text>
      <text x="754" y="278" font-size="11.5" fill="#6f7d77">摘要、情景、事实</text>
    </g>
    <g>
      <rect x="728" y="292" width="250" height="40" rx="12" fill="#e2eeeb" stroke="#cfe1da"/>
      <rect x="740" y="304" width="4" height="16" rx="2" fill="#245550"/>
      <text x="754" y="309" font-size="13.5" font-weight="700" fill="#245550">关系 · L2</text>
      <text x="754" y="324" font-size="11.5" fill="#6f7d77">阶段、边界、承诺</text>
    </g>

    <path d="M978 266 H994" fill="none" stroke="#356d6a" stroke-width="1.6" marker-end="url(#heroArrow)"/>

    <rect x="998" y="200" width="120" height="132" rx="16" fill="#f5ecdd" stroke="#e4d6bf"/>
    <text x="1058" y="226" font-size="16.5" font-weight="700" fill="#3f514d" text-anchor="middle">该不该提？</text>
    <text x="1058" y="245" font-size="11" fill="#8a7d72" text-anchor="middle">边界先否决</text>
    <path d="M1012 256 H1104" stroke="#ddcdb4" stroke-width="1"/>
    <rect x="1008" y="266" width="100" height="26" rx="13" fill="#2e6b64"/>
    <text x="1058" y="283" font-size="12.5" font-weight="600" fill="#f7efe1" text-anchor="middle">自然提起</text>
    <rect x="1008" y="300" width="100" height="26" rx="13" fill="#fffdf8" stroke="#d8d0c0"/>
    <text x="1058" y="317" font-size="12.5" font-weight="600" fill="#6f7d77" text-anchor="middle">保持沉默</text>

    <path d="M728 374 H742" stroke="#cf6b4f" stroke-width="2.5" stroke-linecap="round"/>
    <text x="752" y="379" font-size="12.5" fill="#8b5a49">删掉的事，重放也不会回来。</text>
  </g>
</svg>
